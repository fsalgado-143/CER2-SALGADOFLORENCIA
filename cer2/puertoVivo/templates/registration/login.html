{% extends 'puertoVivo/base.html' %}

{% block title %}Iniciar sesión - Patrimonio Vivo{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-4">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Iniciar sesión
                </h2>

                <form method="POST">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Usuario o contraseña incorrectos.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">
                            Usuario
                        </label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Contraseña
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Ingresar
                    </button>

                </form>
            </div>
        </div>
    </div>
</section>

{% endblock %}
