{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %} - Fundación Puerto Vivo - {% endblock %}</title>
        <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{% static 'puertoVivo/styles/style.css' %}">
    
</head>
<body>
    
    <!-- navbar-->
    <nav class="navbar navbar-expand-lg  navbar-style shadow">
        <div class="container">

            <a class="navbar-brand" href="{% url 'home' %}">
                Patrimonio Vivo
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" 
                        href="{% url 'catalogo' %}">
                            Catálogo
                        </a>
                    </li>
                </ul>

                <!-- Opciones según autenticación -->
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">
                        Hola, {{ user.username }}
                    </span>

                    <a class="btn btn-outline-light"
                       >
                        Cerrar sesión
                    </a>
                {% else %}
                    <a class="btn btn-outline-light"
                       >
                        Iniciar sesión
                    </a>
                {% endif %}

            </div>
        </div>
    </nav>


<footer class="footer-style">
    <div class="container text-center py-3">
        <p class="mb-0">© 2024 Fundación Puerto Vivo. Todos los derechos reservados.</p>
    </div>
</footer>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>




</body>
</html>
